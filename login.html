<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ProjectHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #334155;
            background: #f8fafc;
            background-image:
                radial-gradient(at 10% 20%, rgba(79, 70, 229, 0.06) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(2, 132, 199, 0.06) 0px, transparent 50%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px 32px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
        }

        .logo {
            margin-bottom: 22px;
            color: #4f46e5;
            font-size: 26px;
            font-weight: 850;
            letter-spacing: -0.5px;
            text-align: center;
            transition: 0.2s;
        }

        .logo:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin-bottom: 26px;
            color: #64748b;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #1e293b;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.38);
        }

        .demo-btn {
            margin-top: 10px;
            background: rgba(79, 70, 229, 0.08);
            border: 1px solid rgba(79, 70, 229, 0.25);
            color: #4f46e5;
            font-weight: 600;
            font-size: 13px;
            box-shadow: none;
        }

        .demo-btn:hover:not(:disabled) {
            background: rgba(79, 70, 229, 0.14);
            color: #4338ca;
            box-shadow: none;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #message {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .register-link {
            margin-top: 22px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
        }

        a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <a href="home.html" style="text-decoration: none;">
            <div class="logo">✦ ProjectHub</div>
        </a>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Log in to collaborate, build projects, and connect with students.
        </p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Log In</button>

            <button type="button" id="demoLoginBtn" class="demo-btn">
                ⚡ Quick Demo Student Login
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>
    </main>

    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
