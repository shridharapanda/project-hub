<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ProjectHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #334155;
            background: #f8fafc;
            background-image:
                radial-gradient(at 10% 20%, rgba(79, 70, 229, 0.06) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(2, 132, 199, 0.06) 0px, transparent 50%);
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 38px 32px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
        }

        .logo {
            margin-bottom: 22px;
            color: #4f46e5;
            font-size: 26px;
            font-weight: 850;
            letter-spacing: -0.5px;
            text-align: center;
            transition: 0.2s;
        }

        .logo:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin-bottom: 26px;
            color: #64748b;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #1e293b;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.38);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .login-link {
            margin-top: 22px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
        }

        a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="register-card">
        <a href="home.html" style="text-decoration: none;">
            <div class="logo">✦ ProjectHub</div>
        </a>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join students, discover projects, and build something amazing.
        </p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
                minlength="2"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>
    </main>

    <script src="config.js"></script>
    <script src="register.js"></script>
</body>
</html>
